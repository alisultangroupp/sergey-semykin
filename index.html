/* Layout: screening-room casting sheet — slate data beside the headshot, then the emotion contact sheet, then the story. Dark-first. */
:root{
  --bg:#121418;--surface:#1b1e24;--line:#2c3038;--fg:#ece9e3;--muted:#959aa3;--accent:#dba15a;--accent-ink:#1a1206;--danger:#e0705f;

}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#eceef1;--surface:#ffffff;--line:#d5d9df;--fg:#16181c;--muted:#5e646d;--accent:#9a5a12;--accent-ink:#fff8ee;--danger:#b33a28;color-scheme:light}}
:root[data-theme="light"]{--bg:#eceef1;--surface:#ffffff;--line:#d5d9df;--fg:#16181c;--muted:#5e646d;--accent:#9a5a12;--accent-ink:#fff8ee;--danger:#b33a28;color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,5vw,64px);padding-block:clamp(28px,6vw,72px) 40px;align-items:start}
.hero-text{min-width:0;display:flex;flex-direction:column;gap:22px}
.name{font-family:var(--display);font-weight:400;font-size:clamp(44px,8vw,96px);line-height:.95;letter-spacing:.01em;margin:0;text-wrap:balance}
.aka{font-family:var(--display);font-size:clamp(24px,3.4vw,36px);color:var(--accent);margin:-10px 0 0;line-height:1.1}
.role{font-size:clamp(16px,2vw,19px);color:var(--muted);margin:0;max-width:40ch}
.slate{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.slate div{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.slate div:nth-child(even){padding-left:14px;border-left:1px solid var(--line)}
.slate b{font-family:var(--mono);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.contacts{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;background:transparent;text-decoration:none;color:var(--fg);user-select:text}
.chip small{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
a.chip:hover,button.chip:hover{border-color:var(--accent)}
.frame{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame .mark{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.frame .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.frame::before,.frame::after{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--accent);z-index:1;pointer-events:none}
.frame::before{top:10px;left:10px;border-right:0;border-bottom:0}
.frame::after{top:10px;right:10px;border-left:0;border-bottom:0}

/* gallery */
.section{padding-block:36px;border-top:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,4vw,44px);margin:0;line-height:1}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:10px;margin-bottom:18px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
.tab span{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.cat-head h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.grid{columns:3 260px;column-gap:10px}
.ph{break-inside:avoid;margin:0 0 10px;position:relative;display:block;width:100%;padding:0;border:0;background:var(--surface)}

.ph-open{display:block;width:100%;padding:0;border:0;background:none}

.cat-empty{border:1px dashed var(--line);padding:22px;color:var(--muted);text-align:center}

.videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:20px}
.vid{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.vid video{width:100%;aspect-ratio:16/9;background:#000;display:block;border:1px solid var(--line)}
.vid figcaption{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.vid figcaption b{font-family:var(--display);font-weight:400;font-size:22px}
.vid figcaption span{color:var(--muted);font-size:14px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{border:0;background:transparent;color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.08em;padding:5px 12px;border-radius:999px;min-width:44px}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* bio */
.bio{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(24px,5vw,64px)}
.bio-text{min-width:0;white-space:pre-line;font-size:16.5px;line-height:1.7;max-width:65ch}
.films{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.films li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.films .dir{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.films li .y{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-variant-numeric:tabular-nums;padding-top:2px}
.foot{padding-block:28px 120px;color:var(--muted);font-size:13px}

/* owner tools */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px}
.bar .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .status{flex:1 1 200px;font-size:13px;color:var(--muted);min-width:0}
.bar .status b{color:var(--fg);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);padding:20px;margin-block:24px;display:grid;gap:16px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;min-width:0}
.form .wide{grid-column:1/-1}

    html+='<section class="wrap section" id="video"><div class="sec-head"><h2>'+L('video')+'</h2><span class="label">'+L('clip')(vids.length)+'</span></div><div class="videos">'
      +vids.map(function(v,i){return '<figure class="vid"><video controls playsinline preload="metadata" src="'+src(v.id)+'"'+(v.poster?' poster="'+src(v.poster)+'"':'')+'></video><figcaption><b>'+esc(v.title)+'</b><span>'+esc([v.role,v.dir].filter(Boolean).join(' · '))+'</span>'+(ed?'<button class="btn small danger" data-delvid="'+i+'">'+(v._confirm?'Точно убрать?':'Убрать видео')+'</button>':'')+'</figcaption></figure>'}).join('')
      +'</div></section>';
  }
  html+='<section class="wrap section" id="photos"><div class="sec-head"><h2>'+L('emo')+'</h2><span class="label">'+state.photos.length+L('photos')+'</span></div>';
  if(!visibleCats.length){
    html+='<div class="cat-empty">'+L('soon')+'</div>';
  } else {
    html+='<nav class="tabs" aria-label="'+L('cats')+'"><button class="tab" data-f="all" aria-pressed="'+(filter==='all')+'">'+L('all')+'<span>'+state.photos.length+'</span></button>'
      +visibleCats.map(function(c){return '<button class="tab" data-f="'+c.id+'" aria-pressed="'+(filter===c.id)+'">'+esc(c.name)+'<span>'+catPhotos(c.id).length+'</span></button>'}).join('')+'</nav>';
    visibleCats.filter(function(c){return filter==='all'||filter===c.id}).forEach(function(c){
      var ps=catPhotos(c.id);
      html+='<div class="cat">';
      if(ed){
        html+='<div class="cat-edit"><input type="text" id="cn-'+c.id+'" data-rename="'+c.id+'" value="'+esc(c.name)+'" aria-label="Название категории">'
          +'<label class="btn small primary upload">+ Фото<input type="file" accept="image/*" multiple data-up="'+c.id+'"></label>'
          +'<button class="btn small danger" data-delcat="'+c.id+'">'+(c._confirm?'Точно удалить?':'Удалить категорию')+'</button></div>';
      } else {
        html+='<div class="cat-head"><h3>'+esc(c.name)+'</h3><span class="label">'+ps.length+'</span></div>';
      }
      if(!ps.length){html+='<div class="cat-empty">Пока нет фото. Нажмите «+ Фото», чтобы добавить.</div>'}
      else{
        html+='<div class="grid">'+ps.map(function(p){
          var t='';
          if(ed){
            t='<div class="tools"><button data-hero="'+p.id+'" class="'+(p.id===h?'on':'')+'" title="Сделать главным">★</button>'
              +'<button data-left="'+p.id+'" title="Сдвинуть назад">←</button>'
              +'<select data-move="'+p.id+'" aria-label="Переместить">'+state.cats.map(function(cc){return '<option value="'+cc.id+'"'+(cc.id===p.cat?' selected':'')+'>'+esc(cc.name)+'</option>'}).join('')+'</select>'
              +'<button data-del="'+p.id+'">'+(p._confirm?'Удалить?':'✕')+'</button></div>';
          }
          return '<figure class="ph"><button class="ph-open" data-open="'+p.id+'" aria-label="'+L('open')+'"><img loading="lazy" src="'+src(p.id)+'" alt="'+esc(c.name)+'"></button>'+t+'</figure>';
        }).join('')+'</div>';
      }
      html+='</div>';
    });
    if(ed) html+='<div class="cat-edit"><input type="text" id="newcat" placeholder="Новая категория, например «Нежность»"><button class="btn small" data-addcat="1">Добавить категорию</button></div>';
  }
  html+='</section>';

  if(state.bio||state.films){
    html+='<section class="wrap section"><div class="bio"><div><div class="sec-head"><h2>'+L('about')+'</h2></div><div class="bio-text">'+esc(state.bio)+'</div></div>'
      +(state.films?'<div><div class="sec-head"><h2>'+L('films')+'</h2></div><ul class="films">'+filmsList()+'</ul></div>':'')+'</div></section>';
  }
  html+='<footer class="wrap foot">'+(state.name?esc(state.name)+(state.aka?' ('+esc(state.aka)+')':'')+' · ':'')+L('folio').toLowerCase()+'</footer>';

  if(owner){
    html+='<div class="bar"><div class="wrap"><div class="status">'
      +(busy?'<b>'+esc(busy)+'</b>':dirty?'<b>Есть несохранённые изменения.</b> Кастинг увидит их после сохранения.':(editing&&!preview?'Режим редактирования':'Так страницу видят по ссылке'))
      +'</div>'
      +(editing?'<button class="btn" data-preview="1">'+(preview?'Вернуться к правке':'Как видит кастинг')+'</button>':'<button class="btn" data-edit="1">Редактировать</button>')
      +'<button class="btn primary" data-save="1"'+((!dirty||busy)?' disabled':'')+'>Сохранить</button></div></div>';
  }
  root.innerHTML=html;
}

function formPanel(){
  function f(k,label,ph,wide){return '<label'+(wide?' class="wide"':'')+'><span class="label">'+label+'</span><input type="text" id="f-'+k+'" data-k="'+k+'" value="'+esc(state[k])+'" placeholder="'+esc(ph||'')+'"></label>'}
  function t(k,label,ph){return '<label class="wide"><span class="label">'+label+'</span><textarea id="f-'+k+'" data-k="'+k+'" placeholder="'+esc(ph)+'">'+esc(state[k])+'</textarea></label>'}
  return '<div class="wrap"><div class="panel"><div class="sec-head" style="margin:0"><h2 style="font-size:28px">Анкета</h2><span class="label">видна только вам</span></div><div class="form">'
    +f('name','Имя и фамилия','Например: Алишер Нурланов')+f('aka','Сценическое имя','Если есть')+f('role','Кто вы','Актёр кино и сериалов')+f('city','Город','Алматы')
    +f('age','Игровой возраст','25–32')+f('height','Рост','182 см')+f('eyes','Глаза','Карие')+f('hair','Волосы','Тёмные, короткие')
    +f('languages','Языки','Казахский, русский, английский')+f('skills','Навыки','Верховая езда, бокс, вокал',true)
    +f('phone','Телефон','+7 700 000 00 00')+f('email','Почта','')+f('telegram','Telegram','@username')+f('instagram','Instagram','@username')+f('tiktok','TikTok','@username')
    +t('bio','О себе','Коротко: образование, опыт, чем вы интересны как актёр.')
    +t('films','Фильмография — каждая работа с новой строки','2024 — «Название», роль')
    +'</div></div></div>';
}

/* image compression before upload */
function shrink(file){
  return new Promise(function(res){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var max=2200,w=img.naturalWidth,hh=img.naturalHeight,k=Math.min(1,max/Math.max(w,hh));
      var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(hh*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(function(b){res(b||file)},'image/jpeg',0.88);
    };
    img.onerror=function(){URL.revokeObjectURL(url);res(file)};
    img.src=url;
  });
}
async function upload(cid,files){
  if(!assets){toast('Загрузка фото здесь недоступна. Откройте страницу в своём аккаунте Claude.');return}
  files=Array.prototype.slice.call(files);var ok=0;
  for(var i=0;i<files.length;i++){
    busy='Загружаю фото '+(i+1)+' из '+files.length+'…';render();
    try{var b=await shrink(files[i]);var r=await assets.upload(b);state.photos.push({id:r.id,cat:cid});ok++;markDirty()}
    catch(e){toast('Фото «'+files[i].name+'» не загрузилось. Попробуйте JPG или PNG.')}
  }
  busy=false;render();
  if(ok) toast('Добавлено фото: '+ok+'. Не забудьте нажать «Сохранить».');
}

function buildDoc(){
  var clean=JSON.parse(JSON.stringify(state));
  clean.cats.forEach(function(c){delete c._confirm});clean.photos.forEach(function(p){delete p._confirm});(clean.videos||[]).forEach(function(v){delete v._confirm});
  var json=JSON.stringify(clean).replace(/</g,'\\u003c');
  var title=esc(clean.name||'Кастинг‑портфолио');
  var body='<title>'+title+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="'+FONTS+'">\n<style id="st">'+CSS+'</style>\n<div id="root"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="app">'+JS+'<\/script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+body+'</body></html>';
}
async function save(){
  if(!artifact){toast('Сохранение здесь недоступно.');return}
  busy='Сохраняю…';render();
  ss(function(){sessionStorage.removeItem(DKEY)});
  try{await artifact.publish(buildDoc());busy='Сохранено. Обновляю страницу…';render()}
  catch(e){
    busy=false; if(!(e&&e.code==='conflict')) saveDraft();
    if(e&&e.code==='conflict'){busy='Страница изменилась в другом окне. Перезагружаю, ваши правки восстановятся…';render();return}
    if(e&&(e.code==='not_writer'||e.code==='not_granted')){owner=false;toast('У вас нет прав на изменение этой страницы.')}
    else if(e&&e.code==='too_large'){toast('Страница слишком большая. Удалите часть фото.')}
    else toast('Не удалось сохранить. Попробуйте ещё раз через минуту.');
    render();
  }
}

/* lightbox */
var lbList=[],lbIdx=0,lbEl=null;
function openLb(id){
  var cats=filter==='all'?state.cats:state.cats.filter(function(c){return c.id===filter});
  lbList=[];cats.forEach(function(c){catPhotos(c.id).forEach(function(p){lbList.push({id:p.id,cat:c.name})})});
  lbIdx=Math.max(0,lbList.findIndex(function(p){return p.id===id}));
  lbEl=document.createElement('div');lbEl.className='lb';lbEl.setAttribute('role','dialog');lbEl.setAttribute('aria-modal','true');
  document.body.appendChild(lbEl);document.body.style.overflow='hidden';drawLb();
  var sx=null;lbEl.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  lbEl.addEventListener('touchend',function(e){if(sx==null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)stepLb(dx<0?1:-1);sx=null});
}
function drawLb(){
  var p=lbList[lbIdx];
  lbEl.innerHTML='<div class="lb-top"><span>'+esc(p.cat)+' · '+(lbIdx+1)+' / '+lbList.length+'</span><button data-lbclose="1" aria-label="'+L('close')+'">✕</button></div>'
    +'<div class="lb-img"><img src="'+src(p.id)+'" alt="'+esc(p.cat)+'"></div>'
    +(lbList.length>1?'<button class="nav prev" data-lbstep="-1" aria-label="'+L('prev')+'">‹</button><button class="nav next" data-lbstep="1" aria-label="'+L('next')+'">›</button>':'');
  lbEl.querySelector('[data-lbclose]').focus();
}
function stepLb(d){lbIdx=(lbIdx+d+lbList.length)%lbList.length;drawLb()}
function closeLb(){if(lbEl){lbEl.remove();lbEl=null;document.body.style.overflow=''}}
document.addEventListener('keydown',function(e){if(!lbEl)return;if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')stepLb(1);if(e.key==='ArrowLeft')stepLb(-1)});

/* events */
document.addEventListener('click',function(e){
  var t=e.target.closest('button,[data-lbclose]');if(!t)return;var d=t.dataset;
  if(d.lang){setLang(d.lang);return}
  if(d.lbclose){closeLb();return} if(d.lbstep){stepLb(+d.lbstep);return}
  if(d.f){filter=d.f;render();return}
  if(d.open){openLb(d.open);return}
  if(d.copy){var v=d.copy;try{navigator.clipboard.writeText(v).then(function(){toast(L('copied')+v)},function(){toast(v)})}catch(_){toast(v)}return}
  if(d.edit){editing=true;preview=false;render();return}
  if(d.preview){preview=!preview;render();return}
  if(d.save){save();return}
  if(d.delvid){var vv=state.videos[+d.delvid];if(!vv._confirm){vv._confirm=1;render();return}state.videos.splice(+d.delvid,1);markDirty();render();return}
  if(d.hero){state.hero=d.hero;markDirty();render();return}
  if(d.left){var i=state.photos.findIndex(function(p){return p.id===d.left}),p=state.photos[i];for(var j=i-1;j>=0;j--){if(state.photos[j].cat===p.cat){state.photos.splice(i,1);state.photos.splice(j,0,p);markDirty();break}}render();return}
  if(d.del){var ph=state.photos.find(function(p){return p.id===d.del});if(!ph._confirm){state.photos.forEach(function(p){delete p._confirm});ph._confirm=1;render();return}state.photos=state.photos.filter(function(p){return p!==ph});if(state.hero===ph.id)state.hero='';markDirty();render();return}
  if(d.delcat){var c=state.cats.find(function(x){return x.id===d.delcat});if(!c._confirm){c._confirm=1;render();return}state.cats=state.cats.filter(function(x){return x!==c});state.photos=state.photos.filter(function(p){return p.cat!==c.id});markDirty();render();return}
  if(d.addcat){var inp=document.getElementById('newcat');var n=inp.value.trim();if(!n)return;state.cats.push({id:'c'+Date.now().toString(36),name:n});markDirty();render();return}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.k){state[t.dataset.k]=t.value;markDirty();renderSoon();}
  if(t.dataset.rename){var c=state.cats.find(function(x){return x.id===t.dataset.rename});if(c){c.name=t.value;markDirty();renderSoon()}}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.up&&t.files&&t.files.length){upload(t.dataset.up,t.files)}
  if(t.dataset.move){var p=state.photos.find(function(x){return x.id===t.dataset.move});p.cat=t.value;markDirty();render()}
});
/* re-render after typing pauses, keeping focus */
var rt=null;function renderSoon(){clearTimeout(rt);rt=setTimeout(function(){var a=document.activeElement,id=a&&a.id,s=a&&a.selectionStart,en=a&&a.selectionEnd;render();if(id){var n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(s,en)}catch(_){}}}},700)}

render();
if(notice) toast(notice);

(async function(){
  if(!window.claude||!claude.use) return;
  var user=await claude.use('user');
  var can=user?await user.canEdit():false;
  if(!can) return;
  artifact=await claude.use('artifact');
  assets=await claude.use('assets');
  if(!artifact) return;
  owner=true; editing=true; render();
})();
})();
</script>
